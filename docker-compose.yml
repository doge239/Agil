services:

  auth-db:
    image: postgres:17
    container_name: banner-auth-db

    environment:
      POSTGRES_DB: auth_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5433:5432"

    volumes:
      - auth_data:/var/lib/postgresql/data
      - ./databases/auth/init.sql:/docker-entrypoint-initdb.d/init.sql

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

    restart: unless-stopped


  usuarios-db:
    image: postgres:17
    container_name: banner-usuarios-db

    environment:
      POSTGRES_DB: usuarios_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5434:5432"

    volumes:
      - usuarios_data:/var/lib/postgresql/data
      - ./databases/usuarios/init.sql:/docker-entrypoint-initdb.d/init.sql

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

    restart: unless-stopped


  catalogo-db:
    image: postgres:17
    container_name: banner-catalogo-db

    environment:
      POSTGRES_DB: catalogo_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5435:5432"

    volumes:
      - catalogo_data:/var/lib/postgresql/data
      - ./databases/catalogo/init.sql:/docker-entrypoint-initdb.d/init.sql

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

    restart: unless-stopped


  academico-db:
    image: postgres:17
    container_name: banner-academico-db

    environment:
      POSTGRES_DB: academico_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5436:5432"

    volumes:
      - academico_data:/var/lib/postgresql/data
      - ./databases/academico/init.sql:/docker-entrypoint-initdb.d/init.sql

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

    restart: unless-stopped


  auth-service:
    build: ./services/auth-service
    container_name: banner-auth-service

    environment:
      PORT: 4001
      DB_HOST: auth-db
      DB_PORT: 5432
      DB_NAME: auth_db
      DB_USER: postgres
      DB_PASSWORD: postgres
      JWT_SECRET: clave_super_secreta_banner_desarrollo
      CHOKIDAR_USEPOLLING: "true"

    ports:
      - "4001:4001"

    volumes:
      - ./services/auth-service:/app
      - /app/node_modules

    depends_on:
      auth-db:
        condition: service_healthy

    restart: unless-stopped


  usuarios-service:
    build: ./services/usuarios-service
    container_name: banner-usuarios-service

    environment:
      PORT: 4002
      DB_HOST: usuarios-db
      DB_PORT: 5432
      DB_NAME: usuarios_db
      DB_USER: postgres
      DB_PASSWORD: postgres
      JWT_SECRET: clave_super_secreta_banner_desarrollo
      CHOKIDAR_USEPOLLING: "true"

    ports:
      - "4002:4002"

    volumes:
      - ./services/usuarios-service:/app
      - /app/node_modules

    depends_on:
      usuarios-db:
        condition: service_healthy

    restart: unless-stopped


  catalogo-service:
    build: ./services/catalogo-service
    container_name: banner-catalogo-service

    environment:
      PORT: 4003
      DB_HOST: catalogo-db
      DB_PORT: 5432
      DB_NAME: catalogo_db
      DB_USER: postgres
      DB_PASSWORD: postgres
      JWT_SECRET: clave_super_secreta_banner_desarrollo
      CHOKIDAR_USEPOLLING: "true"

    ports:
      - "4003:4003"

    volumes:
      - ./services/catalogo-service:/app
      - /app/node_modules

    depends_on:
      catalogo-db:
        condition: service_healthy

    restart: unless-stopped


  academico-service:
    build: ./services/academico-service
    container_name: banner-academico-service

    environment:
      PORT: 4004
      DB_HOST: academico-db
      DB_PORT: 5432
      DB_NAME: academico_db
      DB_USER: postgres
      DB_PASSWORD: postgres
      JWT_SECRET: clave_super_secreta_banner_desarrollo
      USUARIOS_SERVICE_URL: http://usuarios-service:4002
      CATALOGO_SERVICE_URL: http://catalogo-service:4003
      CHOKIDAR_USEPOLLING: "true"

    ports:
      - "4004:4004"

    volumes:
      - ./services/academico-service:/app
      - /app/node_modules

    depends_on:
      academico-db:
        condition: service_healthy
      usuarios-service:
        condition: service_started
      catalogo-service:
        condition: service_started

    restart: unless-stopped


  gateway:
    build: ./gateway
    container_name: banner-gateway

    environment:
      PORT: 4000
      AUTH_SERVICE_URL: http://auth-service:4001
      USUARIOS_SERVICE_URL: http://usuarios-service:4002
      CATALOGO_SERVICE_URL: http://catalogo-service:4003
      ACADEMICO_SERVICE_URL: http://academico-service:4004
      CHOKIDAR_USEPOLLING: "true"

    ports:
      - "4000:4000"

    volumes:
      - ./gateway:/app
      - /app/node_modules

    depends_on:
      - auth-service
      - usuarios-service
      - catalogo-service
      - academico-service

    restart: unless-stopped


  auth-seed:
    build: ./services/auth-service
    container_name: banner-auth-seed

    environment:
      DB_HOST: auth-db
      DB_PORT: 5432
      DB_NAME: auth_db
      DB_USER: postgres
      DB_PASSWORD: postgres
      JWT_SECRET: clave_super_secreta_banner_desarrollo

    depends_on:
      auth-db:
        condition: service_healthy

    command: ["node", "src/scripts/crearUsuario.js"]

    restart: "no"


  frontend:
    build: ./frontend
    container_name: banner-frontend

    ports:
      - "5173:5173"

    volumes:
      - ./frontend:/app
      - /app/node_modules

    environment:
      VITE_API_URL: http://localhost:4000/api
      CHOKIDAR_USEPOLLING: "true"

    depends_on:
      - gateway

    restart: unless-stopped


volumes:
  auth_data:
  usuarios_data:
  catalogo_data:
  academico_data:
